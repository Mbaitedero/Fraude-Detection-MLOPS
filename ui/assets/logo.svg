<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Dégradé bleu principal -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
    <!-- Dégradé rouge/orange pour la flèche -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    
    <!-- Ombre portée -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond circulaire bleu -->
  <circle cx="50" cy="50" r="46" fill="#0f172a"/>
  <circle cx="50" cy="50" r="46" fill="url(#blueGrad)" opacity="0.15"/>
  
  <!-- Bouclier stylisé -->
  <path d="M 50 12 
           L 82 24 
           L 82 50 
           Q 82 74 50 88 
           Q 18 74 18 50 
           L 18 24 Z" 
        fill="none" 
        stroke="url(#blueGrad)" 
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#shadow)"/>
  
  <!-- Lettre M -->
  <path d="M 32 65 L 32 40 L 50 58 L 68 40 L 68 65" 
        fill="none" 
        stroke="#60a5fa" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Flèche ascendante (croissance) -->
  <path d="M 55 38 L 74 22 L 74 34 L 85 34 L 85 22 L 92 22 L 92 42 L 55 42 Z" 
        fill="url(#arrowGrad)" 
        opacity="0.95"/>
  
  <!-- Point lumineux -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.3"/>
</svg>